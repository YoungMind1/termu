name: Build Termu

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build binaries
        run: |
          mkdir -p dist
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
                go build -ldflags="-s -w" -o "dist/termu-${goos}-${goarch}" .
            done
          done

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Termu (Latest Build)"
          make_latest: "true"
          files: dist/termu-*
